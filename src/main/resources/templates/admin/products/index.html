<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://thymeleaf.org">
<head>
    <div th:replace="~{fragments/site :: header}"></div>
    <div th:replace="~{fragments/site :: datatables-css}"></div>
    <title>Produtos</title>
</head>
<body>
<div th:replace="~{fragments/site :: menu}"></div>
<div th:replace="~{fragments/modal :: modal-confirm}"></div>
<div th:replace="~{fragments/modal :: modal-csv-upload}"></div>

<div class="container">
    <nav class="nav border mt-2 mb-4 mb-4 bg-light justify-content-between">
        <span class="nav-link font-weight-bold">Produtos</span>
        <div class="d-flex align-items-center">
            <a class="nav-link" href="/admin/products/batch">Upload CSV Batch</a>
            <a class="nav-link"  data-toggle="modal" data-target="#csv-upload-modal" role="button">Upload CSV</a>
            <a class="nav-link" href="/admin/products/create">Novo</a>
        </div>
    </nav>
    <div th:replace="~{fragments/site :: messages}"></div>
    <table id="table-products" class="table table-sm table-striped table-bordered nowrap w-100">
        <thead class="thead-dark">
        <tr>
            <th scope="col">foto</th>
            <th scope="col">#</th>
            <th scope="col">Título</th>
            <th scope="col">Categoria</th>
            <th scope="col">Preço</th>
            <th scope="col">Editar</th>
            <th scope="col">Excluir</th>
        </tr>
        </thead>
    </table>
</div>

<div th:replace="~{fragments/site :: scripts}"></div>
<div th:replace="~{fragments/site :: datatables-js}"></div>
<script th:src="@{/js/products.js}"></script>
<script>
    $('#file').on('change', function(){
        if ($('#file')[0].files.length > 0)
            $('#save-csv').removeClass('d-none')
    })
    $('button').on('click', function() {
        $('#save-csv').addClass('d-none')
    })
</script>
</body>
</html>
