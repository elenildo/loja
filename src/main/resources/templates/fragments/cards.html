<div th:fragment="product-card" th:each="product : ${products}" class="col-xs-6 col-sm-6 col-md-3 col-lg-3">
    <a th:href="@{'/product/'+${product.id}}" class="text-decoration-none text-body">
        <div class="d-flex flex-column mt-4 shadow p-3 bg-white" style="height:300px">
            <div class="d-flex mb-2 justify-content-center align-items-center">
                <img th:if="${product.image != null}" th:src="@{${product.image}}" class="card-img">
                <img th:unless="${product.image != null}" th:src="@{/img/prod-not-found.webp}" class="card-img">
            </div>
            <div class="title-card">
                <p th:text="${product.title}"></p>
            </div>
            <div class="d-inline-flex">
                R$
                <h3 th:text="${product.price}"></h3>
            </div>
        </div>
    </a>
</div>
