<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://thymeleaf.org">
<head>
    <div th:replace="~{fragments/site :: header}"></div>
    <title>Categorias - Admin</title>
</head>
<body>
<div th:replace="~{fragments/site :: menu}"></div>
<div class="container">
    <div class="container w-50">
        <h3>Cadastro de Categorias</h3>
        <form th:object="${category}" th:action="@{/admin/categories}" method="POST">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="mb-3">
                <label for="name" class="form-label">Nome *</label>
                <input type="text" class="form-control" th:field="*{name}" id="name">
                <p th:if="${#fields.hasErrors('name')}" th:errorclass="text-danger" th:errors="${category.name}"></p>
            </div>
            <button type="submit" class="btn btn-primary">Salvar</button>
        </form>
    </div>
</div>

<div th:replace="~{fragments/site :: scripts}"></div>
</body>
</html>
