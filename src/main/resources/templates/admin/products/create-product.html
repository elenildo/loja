<!doctype html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://thymeleaf.org">
<head>
    <div th:replace="~{fragments/site :: header}"></div>
    <title>Produtos - Admin</title>
</head>
<body>
<div th:replace="~{fragments/site :: menu}"></div>
<div class="container">
    <nav class="nav border mt-2 mb-4 bg-light justify-content-between">
        <span class="nav-link font-weight-bold">Cadastro de Produtos</span>
        <a class="nav-link active" href="/admin/products">Voltar</a>
    </nav>

    <form th:object="${productDto}" th:action="@{/admin/products}" method="POST" enctype="multipart/form-data">
        <input type="hidden" th:field="*{id}" th:value="${id}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="mb-3">
            <label for="category" class="form-label">Categoria *</label>
            <select id="category" th:field="*{category}" class="form-control">
                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
            </select>
            <p th:if="${#fields.hasErrors('category')}" th:errorclass="text-danger" th:errors="*{category}"></p>
        </div>
        <div class="mb-3">
            <label for="title" class="form-label">Título *</label>
            <input type="text" th:field="*{title}" id="title" class="form-control">
            <p th:if="${#fields.hasErrors('title')}" th:errorclass="text-danger" th:errors="*{title}"></p>
        </div>
        <div class="mb-3">
            <label for="price" class="form-label">Preço de Venda *</label>
            <input type="number" th:field="*{price}" id="price" step="0.01" min="0" class="form-control">
            <p th:if="${#fields.hasErrors('price')}" th:errorclass="text-danger" th:errors="*{price}"></p>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Descrição</label>
            <textarea th:field="*{description}" id="description" class="form-control"></textarea>
            <p th:if="${#fields.hasErrors('description')}" th:errorclass="text-danger" th:errors="*{description}"></p>
        </div>
        <div class="d-flex mb-3">
            <div th:each="imgUrl : ${productDto.imageSources}" class="form-img-list">
                <img th:src="@{ ${imgUrl} }" class="w-100" th:alt="${imgUrl}">
            </div>
        </div>
        <div class="mb-3">
            <label for="images" class="form-label">Imagens</label>
            <input type="file" th:field="*{images}" id="images" multiple
                   accept=".jpg, .jpeg, .png, .gif, .bmp, .webp" class="form-control">
            <p th:if="${#fields.hasErrors('images')}" th:errorclass="text-danger" th:errors="*{images}"></p>
        </div>
        <button type="submit" class="btn btn-primary">Salvar</button>
    </form>
</div>

<div th:replace="~{fragments/site :: scripts}"></div>
</body>
</html>
